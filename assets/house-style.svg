<svg viewBox="55 0 648 150" width="648" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect x="55" y="0" width="648" height="150" fill="#ffffff"/>

  <!-- title: content center x = (77 + 681) / 2 = 379, y = 20 + 16*0.75 = 32 -->
  <text x="379" y="32" font-size="16" fill="#1e293b" text-anchor="middle">Where a diagram comes from and where it lives</text>

  <!-- connectors (painted below the boxes) -->
  <path d="M244,88 L 256,88" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M472,88 L 484,88" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Each stage carries a face so the three of them read as a cast rather than three slabs.
       The chip lives inside the box, 20px in from its left edge, because the label has to stay
       on the box centre for the baseline check — the box is widened to make room, not the label moved. -->

  <!-- Box A: x=77, y=70, w=162, h=36, right edge=239, bottom edge=106 -->
  <rect x="77" y="70" width="162" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <circle cx="97" cy="88" r="9" fill="#ffffff" stroke="#3b82f6"/>
  <circle cx="93.6" cy="85.8" r="1.5" fill="#1e293b"/>
  <circle cx="100.4" cy="85.8" r="1.5" fill="#1e293b"/>
  <ellipse cx="97" cy="91.0" rx="1.4" ry="1.8" fill="#1e293b"/>
  <text x="158" y="92" font-size="12" fill="#1e40af" text-anchor="middle">Markdown doc</text>

  <!-- Box B: x=267, y=70, w=200, h=36, right edge=467 -->
  <rect x="267" y="70" width="200" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <circle cx="287" cy="88" r="9" fill="#ffffff" stroke="#f59e0b"/>
  <circle cx="283.6" cy="85.8" r="1.5" fill="#1e293b"/>
  <circle cx="290.4" cy="85.8" r="1.5" fill="#1e293b"/>
  <path d="M283.8,89.8 Q 287,93.4 290.2,89.8" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <text x="367" y="92" font-size="12" fill="#b45309" text-anchor="middle">svg-diagram skill</text>

  <!-- Box C: x=495, y=70, w=186, h=36, right edge=681 -->
  <rect x="495" y="70" width="186" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <circle cx="515" cy="88" r="9" fill="#ffffff" stroke="#22c55e"/>
  <circle cx="511.6" cy="85.8" r="1.5" fill="#1e293b"/>
  <circle cx="518.4" cy="85.8" r="1.5" fill="#1e293b"/>
  <path d="M511.8,89.8 Q 515,93.4 518.2,89.8" fill="none" stroke="#1e293b" stroke-width="1.3"/>
  <text x="588" y="92" font-size="12" fill="#166534" text-anchor="middle">assets/arch.svg</text>

  <!-- caption, baseline = 106 + 19 = 125 -->
  <text x="379" y="125" font-size="10" fill="#64748b" text-anchor="middle">spacing, baselines, arrowheads and escaping are all pre-decided</text>
</svg>
