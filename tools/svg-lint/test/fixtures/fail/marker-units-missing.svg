  </defs>
  <path d="M117,80 L 129,80" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="22" y="62" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
